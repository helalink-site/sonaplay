name: Build Sona Play Android app

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'supabase/**', 'admin.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Copy the website into the app
        run: node scripts/build-www.js
      - name: Create the Android project
        run: npx cap add android
      - name: Permissions and sign-in link
        run: node scripts/patch-android.js
      - name: App icon and splash
        run: npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SonaPlay-native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SonaPlay-native
          path: native/SonaPlay-native.apk
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Sona Play app ${{ github.run_number }}
          files: native/SonaPlay-native.apk
