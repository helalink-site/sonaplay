<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0b0c10">
<title>Sona Play · Admin</title>
<style>
:root{--bg:#0b0c10;--s1:#12141a;--s2:#1a1d26;--b:#262a36;--t:#eef0f6;--t2:#9aa1b4;--v:#7c6cff;--v2:#a89cff;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b7a;--r:14px}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--t);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:9px 14px;transition:.15s}
button:hover{border-color:var(--v2)}button.p{background:var(--v);border-color:var(--v);color:#fff}button.p:hover{filter:brightness(1.1)}button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--v)}
textarea{resize:vertical;min-height:84px}label{display:block;font-size:12px;color:var(--t2);margin:12px 0 5px}
.hide{display:none!important}.mut{color:var(--t2)}.sm{font-size:12px}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lgc{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--b);border-radius:20px;padding:28px}
.lgc h1{font-size:22px;margin:10px 0 4px}.logo{width:44px;height:44px;border-radius:12px;background:var(--v);display:grid;place-items:center;font-weight:700;font-size:22px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--s1);border-right:1px solid var(--b);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:600}.brand .logo{width:34px;height:34px;font-size:17px;border-radius:10px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:none;border:0;color:var(--t2);text-align:left}
.nv.on{background:var(--s2);color:var(--t)}.nv:hover{color:var(--t)}.nv svg{width:18px;height:18px;flex:none}.sp{flex:1}
main{padding:24px 28px 90px;max-width:1100px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.top h2{font-size:22px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c{background:var(--s1);border:1px solid var(--b);border-radius:var(--r);padding:18px}.c h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.kpi .n{font-size:28px;font-weight:600;letter-spacing:-.5px}.kpi .l{font-size:12px;color:var(--t2)}.kpi .d{font-size:12px;color:var(--ok)}
.sg{display:flex;gap:4px;background:var(--s2);padding:3px;border-radius:10px}.sg button{border:0;padding:5px 11px;background:none;font-size:12px;color:var(--t2)}.sg button.on{background:var(--v);color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}.bar em{font-style:normal;width:34%;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar u{flex:1;height:8px;background:var(--s2);border-radius:6px;overflow:hidden;text-decoration:none}.bar u i{display:block;height:100%;background:var(--v);border-radius:6px}.bar span{width:54px;text-align:right;color:var(--t2);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--b)}.row:first-of-type{border-top:0}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--s2);color:var(--t2)}.pill.ok{background:#12352a;color:var(--ok)}.pill.bad{background:#3a1a20;color:var(--bad)}.pill.warn{background:#3a2d14;color:var(--warn)}
.tg{width:42px;height:24px;border-radius:12px;background:var(--b);position:relative;cursor:pointer;flex:none;border:0;padding:0}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.tg.on{background:var(--v)}.tg.on::after{left:21px}
.err{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--t2);border-top:1px solid var(--b);padding:8px 0;word-break:break-word}
.cm{border-top:1px solid var(--b);padding:11px 0;display:flex;gap:12px;align-items:flex-start}.cm p{flex:1;font-size:14px;word-break:break-word}
.sk{height:60px;border-radius:10px;background:linear-gradient(90deg,var(--s2),var(--b),var(--s2));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.bot{display:none}
#tt{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--b);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}#tt.on{opacity:1}
.mo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40;padding:20px}.mo .c{max-width:380px;width:100%}.mo .ac{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:860px){.app{display:block}.side{display:none}main{padding:16px 14px 100px}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}
.bot{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.bot .nv{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:7px 2px;align-items:center}}
</style></head><body>
<div class="lg" id="lg"><div class="lgc"><div class="logo">S</div><h1>Sona Play admin</h1><p class="mut sm">Sign in with your admin account.</p>
<label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
<button class="p" style="width:100%;margin-top:18px" id="lb">Sign in</button><p class="sm" style="color:var(--bad);margin-top:10px" id="lm"></p></div></div>
<div class="app hide" id="app">
<aside class="side"><div class="brand"><div class="logo">S</div>Sona Play</div><div id="nv1"></div><div class="sp"></div><button class="nv" id="lo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button></aside>
<main>
<section id="s-ov"></section><section id="s-mu" class="hide"></section><section id="s-ms" class="hide"></section><section id="s-sv" class="hide"></section><section id="s-st" class="hide"></section>
</main><nav class="bot" id="nv2"></nav></div>
<div id="tt"></div><div id="mo"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
const $=s=>document.querySelector(s),C=window.SONA_CONFIG||{};let sb;try{sb=supabase.createClient(C.SUPA_URL,C.SUPA_ANON_KEY)}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fm=n=>Number(n||0).toLocaleString();
const IC={ov:'<path d="M3 12l9-9 9 9M5 10v10h14V10"/>',mu:'<path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>',ms:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',sv:'<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/>',st:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const TABS=[['ov','Overview'],['mu','Music'],['ms','Messages'],['sv','Server'],['st','Settings']];
function nav(){const h=TABS.map(t=>`<button class="nv" data-t="${t[0]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[t[0]]}</svg>${t[1]}</button>`).join('');$('#nv1').innerHTML=h;$('#nv2').innerHTML=h;document.querySelectorAll('.nv[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t))}
const LOAD={};function show(t){TABS.forEach(x=>{$('#s-'+x[0]).classList.toggle('hide',x[0]!==t)});document.querySelectorAll('.nv[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));(LOAD[t]||(()=>{}))();scrollTo(0,0)}
function toast(m){const e=$('#tt');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function ask(msg,ok,fn,danger){$('#mo').innerHTML=`<div class="mo"><div class="c"><p>${esc(msg)}</p><div class="ac"><button id="mn">Cancel</button><button class="${danger?'d':'p'}" id="my">${esc(ok)}</button></div></div></div>`;$('#mn').onclick=()=>$('#mo').innerHTML='';$('#my').onclick=()=>{$('#mo').innerHTML='';fn()}}
const rpc=(n,a)=>sb.rpc(n,a||{}).then(r=>{if(r.error)throw r.error;return r.data});
const tok=()=>sb.auth.getSession().then(r=>r.data.session&&r.data.session.access_token);
const adm=(p,b)=>tok().then(t=>fetch(C.API+p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(b||{})}).then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok)throw new Error(j.error||'Request failed');return j})));
const sk=n=>Array(n).fill('<div class="sk" style="margin:8px 0"></div>').join('');
function area(el,rows,col){if(!rows||!rows.length){el.innerHTML='<p class="mut sm">No data yet.</p>';return}const v=rows.map(r=>Number(r.users)),m=Math.max(1,...v),n=v.length,W=600,H=170;const x=i=>n<2?W/2:Math.round(i/(n-1)*(W-20)+10),y=a=>Math.round(H-20-a/m*(H-40));
const pts=v.map((a,i)=>x(i)+','+y(a)).join(' ');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="g${col.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(k=>`<line x1="10" x2="${W-10}" y1="${20+k*(H-40)/3}" y2="${20+k*(H-40)/3}" stroke="#262a36" stroke-width="1"/>`).join('')}<polygon points="10,${H-20} ${pts} ${W-10},${H-20}" fill="url(#g${col.slice(1)})"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/><text x="10" y="${H-3}" fill="#9aa1b4" font-size="11">${esc(rows[0].bucket)}</text><text x="${W-10}" y="${H-3}" text-anchor="end" fill="#9aa1b4" font-size="11">${esc(rows[n-1].bucket)}</text><text x="${W-10}" y="14" text-anchor="end" fill="#9aa1b4" font-size="11">peak ${fm(m)}</text></svg>`}
function bars(el,rows,k,v,unit){if(!rows||!rows.length){el.innerHTML='<p class="mut sm">No data yet.</p>';return}const m=Math.max(1,...rows.map(r=>Number(r[v])));el.innerHTML=rows.map(r=>`<div class="bar"><em title="${esc(r[k])}">${esc(r[k]||'Unknown')}</em><u><i style="width:${Math.max(3,Number(r[v])/m*100)}%"></i></u><span>${fm(r[v])}</span></div>`).join('')}
/* OVERVIEW */
let per='day';LOAD.ov=function(){const el=$('#s-ov');if(!el.dataset.r){el.innerHTML=`<div class="top"><h2>Overview</h2><button id="rf">Refresh</button></div><div class="g g3" id="kp">${sk(6)}</div><div class="g g2" style="margin-top:14px"><div class="c"><h3>New users <span class="sg" id="sp1"><button data-p="day">Day</button><button data-p="week">Week</button><button data-p="month">Month</button></span></h3><div id="c1"></div></div><div class="c"><h3>Active users</h3><div id="c2"></div></div></div><div class="g g2" style="margin-top:14px"><div class="c"><h3>Users by region</h3><div id="rg"></div></div><div class="c"><h3>Favourite genres</h3><div id="gn"></div></div></div>`;el.dataset.r=1;$('#rf').onclick=LOAD.ov;document.querySelectorAll('#sp1 button').forEach(b=>b.onclick=()=>{per=b.dataset.p;LOAD.ov()})}
document.querySelectorAll('#sp1 button').forEach(b=>b.classList.toggle('on',b.dataset.p===per));
rpc('admin_overview').then(o=>{const K=[['Total users',o.total_users],['New today',o.new_today],['Active today',o.active_today],['Active, 7 days',o.active_7d],['Active, 30 days',o.active_30d],['No region set',o.no_region]];$('#kp').innerHTML=K.map(k=>`<div class="c kpi"><div class="l">${k[0]}</div><div class="n">${fm(k[1])}</div></div>`).join('')}).catch(e=>toast(e.message));
const cnt=per==='day'?30:12;rpc('admin_signups',{p_period:per,p_count:cnt}).then(r=>area($('#c1'),r,'#7c6cff')).catch(()=>{});rpc('admin_active',{p_period:per,p_count:cnt}).then(r=>area($('#c2'),r,'#3ddc97')).catch(()=>{});
rpc('admin_by_region').then(r=>bars($('#rg'),r,'region','users')).catch(()=>{});rpc('admin_genre_split').then(r=>bars($('#gn'),r,'genre','users')).catch(()=>{$('#gn').innerHTML='<p class="mut sm">Run the 008 SQL to see this.</p>'})}
/* MUSIC */
let mdays=30;LOAD.mu=function(){const el=$('#s-mu');el.innerHTML=`<div class="top"><h2>Music</h2><div class="sg" id="sp2"><button data-d="7">7 days</button><button data-d="30">30 days</button><button data-d="90">90 days</button></div></div><div class="g g2"><div class="c"><h3>Plays per day</h3><div id="pl"></div></div><div class="c"><h3>Most followed artists</h3><div id="fo"></div></div><div class="c"><h3>Top songs</h3><div id="ts"></div></div><div class="c"><h3>Top artists</h3><div id="ta"></div></div></div>`;
document.querySelectorAll('#sp2 button').forEach(b=>{b.classList.toggle('on',+b.dataset.d===mdays);b.onclick=()=>{mdays=+b.dataset.d;LOAD.mu()}});
rpc('admin_plays_by_day',{p_days:mdays}).then(r=>area($('#pl'),r,'#7c6cff')).catch(()=>$('#pl').innerHTML='<p class="mut sm">Run the 008 SQL first.</p>');
rpc('admin_top_followed',{p_limit:8}).then(r=>bars($('#fo'),r,'artist','followers')).catch(()=>{});
rpc('admin_top_songs',{p_days:mdays,p_limit:10}).then(r=>bars($('#ts'),r.map(x=>({n:(x.title||x.video_id)+(x.artist?' · '+x.artist:''),plays:x.plays})),'n','plays')).catch(()=>{});
rpc('admin_top_artists',{p_days:mdays,p_limit:10}).then(r=>bars($('#ta'),r,'artist','plays')).catch(()=>{})}
/* MESSAGES */
LOAD.ms=function(){const el=$('#s-ms');el.innerHTML=`<div class="top"><h2>Messages</h2></div><div class="g g2"><div class="c"><h3>Send to everyone</h3><label>Audience</label><select id="ar"><option value="">All regions</option></select><label>Title</label><input id="bt" maxlength="80" placeholder="What is new"><label>Message</label><textarea id="bb" maxlength="240" placeholder="Short and clear"></textarea><div class="row" style="border:0"><span class="sm mut" id="bn"></span><button class="p" id="bs">Send</button></div></div><div class="c"><h3>Recent messages</h3><div id="bh">${sk(3)}</div></div></div><div class="c" style="margin-top:14px"><h3>Replies to review <span class="sm mut">Text only</span></h3><div id="cr">${sk(2)}</div></div>`;
rpc('admin_by_region').then(r=>{const s=$('#ar');r.filter(x=>x.region!=='Not set').forEach(x=>s.insertAdjacentHTML('beforeend',`<option value="${esc(x.region)}">${esc(x.region)} (${fm(x.users)})</option>`));s.dataset.all=r.reduce((a,x)=>a+Number(x.users),0)}).catch(()=>{});
$('#bs').onclick=()=>{const t=$('#bt').value.trim(),b=$('#bb').value.trim(),rg=$('#ar').value;if(!t||!b){toast('Add a title and a message');return}ask('Send "'+t+'" to '+(rg||'all regions')+'? This cannot be undone.','Send',()=>{rpc('admin_send_broadcast',{p_title:t,p_body:b,p_region:rg||null}).then(n=>{toast('Sent to '+fm(n)+' people');$('#bt').value=$('#bb').value='';adm('/admin/push-now').catch(()=>{});LOAD.ms()}).catch(e=>toast(e.message))})};
sb.from('broadcasts').select('title,body,region,recipients,created_at').order('created_at',{ascending:false}).limit(8).then(r=>{const d=r.data||[];$('#bh').innerHTML=d.length?d.map(x=>`<div class="row" style="align-items:flex-start"><div><b style="font-size:14px">${esc(x.title)}</b><div class="sm mut">${esc(x.body)}</div></div><span class="pill">${fm(x.recipients)} · ${esc(x.region||'All')}</span></div>`).join(''):'<p class="mut sm">Nothing sent yet.</p>'});
rpc('admin_comments',{p_limit:30}).then(r=>{$('#cr').innerHTML=r.length?r.map(c=>`<div class="cm"><p>${esc(c.body)}</p><button class="d" data-id="${esc(c.id)}">Delete</button></div>`).join(''):'<p class="mut sm">No replies yet.</p>';document.querySelectorAll('#cr button').forEach(b=>b.onclick=()=>ask('Delete this reply?','Delete',()=>rpc('admin_delete_comment',{p_id:b.dataset.id}).then(()=>{toast('Deleted');b.closest('.cm').remove()}).catch(e=>toast(e.message)),1))}).catch(()=>$('#cr').innerHTML='<p class="mut sm">Run the 007 and 008 SQL to see replies.</p>')}
/* SERVER */
function dur(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(h?h+'h ':'')+m+'m'}
function ping(u){const t=performance.now();return fetch(u+'/health',{cache:'no-store'}).then(r=>r.json().then(j=>({ok:r.ok,ms:Math.round(performance.now()-t),j}))).catch(()=>({ok:false}))}
LOAD.sv=function(){const el=$('#s-sv');el.innerHTML=`<div class="top"><h2>Server</h2><button id="rs">Refresh</button></div><div class="g g2"><div class="c"><h3>Health</h3><div id="hl">${sk(2)}</div></div><div class="c"><h3>YouTube access</h3><div id="ck">${sk(2)}</div></div></div><div class="g g2" style="margin-top:14px"><div class="c"><h3>Fixes</h3><div class="row"><span>Update the song tool<div class="sm mut">Installs the newest yt-dlp</div></span><button id="fu">Update</button></div><div class="row"><span>Clear saved songs<div class="sm mut" id="cc"></div></span><button id="fc" class="d">Clear</button></div><div class="row"><span>Restart the server<div class="sm mut">Takes a few seconds</div></span><button id="fr">Restart</button></div></div><div class="c"><h3>Update cookies</h3><p class="sm mut">Paste the full text of a fresh cookies.txt export from a spare Google account.</p><textarea id="ct" placeholder="# Netscape HTTP Cookie File" style="margin-top:10px"></textarea><div class="row" style="border:0"><span class="sm mut" id="cs"></span><button class="p" id="cu">Save cookies</button></div></div></div><div class="c" style="margin-top:14px"><h3>Recent errors</h3><div id="er">${sk(2)}</div></div>`;
$('#rs').onclick=LOAD.sv;
(async()=>{const u=[['Main server',C.API]];const cfg=await sb.from('app_config').select('api_url').limit(1).maybeSingle();const pu=cfg.data&&cfg.data.api_url;if(pu)u.push(['Phone server',pu.replace(/\/$/,'')+'/api']);
const rs=await Promise.all(u.map(x=>ping(x[1])));$('#hl').innerHTML=u.map((x,i)=>`<div class="row"><span>${x[0]}<div class="sm mut">${esc(x[1].replace(/^https?:\/\//,''))}</div></span><span class="pill ${rs[i].ok?'ok':'bad'}">${rs[i].ok?'Online · '+rs[i].ms+' ms':'Offline'}</span></div>`).join('')+(pu?'':'<div class="sm mut" style="padding-top:8px">No phone server is set.</div>')})();
adm('/admin/server').then(s=>{$('#ck').innerHTML=`<div class="row"><span>Cookies</span><span class="pill ${s.cookie_active?'ok':'warn'}">${s.cookie_active?'Loaded':'Not loaded'}</span></div><div class="row"><span>Song tool version</span><span class="mut">${esc(s.ytdlp)}</span></div><div class="row"><span>Running for</span><span class="mut">${dur(s.uptime)}</span></div><div class="row"><span>Python</span><span class="mut">${esc(s.python)}</span></div>`;$('#cc').textContent=fm(s.cache_files)+' songs, '+fm(s.cache_mb)+' MB';$('#cs').textContent=s.can_persist_cookies?'Kept after restarts':'Lost on restart unless saved in settings';
$('#er').innerHTML=s.errors.length?s.errors.slice().reverse().map(e=>`<div class="err">${new Date(e.t*1000).toLocaleTimeString()} · ${esc(e.m)}</div>`).join(''):'<p class="mut sm">No errors. All clear.</p>'}).catch(e=>{$('#ck').innerHTML='<p class="mut sm">'+esc(e.message)+'</p>';$('#er').innerHTML=''});
$('#cu').onclick=()=>{const t=$('#ct').value.trim();if(!t){toast('Paste the cookies first');return}adm('/admin/cookies',{text:t}).then(r=>{$('#ct').value='';toast('Cookies saved ('+r.lines+' YouTube lines)');LOAD.sv()}).catch(e=>toast(e.message))};
$('#fu').onclick=()=>{toast('Updating, please wait...');adm('/admin/update-ytdlp').then(r=>toast(r.ok?'Updated. Restart to use it.':'Update failed')).catch(e=>toast(e.message))};
$('#fc').onclick=()=>ask('Delete every saved song from the server?','Clear',()=>adm('/admin/clear-cache').then(r=>{toast(fm(r.removed)+' files removed');LOAD.sv()}).catch(e=>toast(e.message)),1);
$('#fr').onclick=()=>ask('Restart the server now?','Restart',()=>adm('/admin/restart').then(()=>{toast('Restarting...');setTimeout(LOAD.sv,6000)}).catch(e=>toast(e.message)))}
/* SETTINGS */
LOAD.st=function(){const el=$('#s-st');el.innerHTML=`<div class="top"><h2>Settings</h2></div><div class="g g2"><div class="c"><h3>App</h3><div class="row"><span>DJ mixes tab</span><button class="tg" id="tdj"></button></div><div class="row"><span>Premium features</span><button class="tg" id="tpr"></button></div><label>Home banner image (https link)</label><input id="hi"><button class="p" id="sa" style="margin-top:14px">Save</button></div><div class="c"><h3>Links</h3><label>Invite link (the username is added at the end)</label><input id="ib" placeholder="https://"><label>Share link for songs (download link)</label><input id="su" placeholder="https://"><button class="p" id="sl" style="margin-top:14px">Save links</button></div><div class="c"><h3>Server the app uses</h3><label>Phone server address (empty means the main server)</label><input id="au" placeholder="https://..."><button class="p" id="sv2" style="margin-top:14px">Save</button></div><div class="c" style="grid-column:1/-1"><h3>Player backgrounds <span class="sm mut">Users pick these in Settings</span></h3><div class="g g3"><div><label>Name</label><input id="bgn" maxlength="40" placeholder="e.g. Sunset"></div><div><label>Picture</label><input id="bgf" type="file" accept="image/*"></div><div style="display:flex;align-items:flex-end"><button class="p" id="bgu" style="width:100%">Upload</button></div></div><div id="bgl" class="g g4" style="margin-top:16px"></div></div><div class="c"><h3>Privacy policy and terms</h3><label>Document</label><select id="lk"><option value="privacy">Privacy policy</option><option value="terms">Terms</option></select><textarea id="lt" style="min-height:150px"></textarea><button class="p" id="sg2" style="margin-top:10px">Publish</button></div></div>`;
let dj=true,pr=false;const tgl=(id,v)=>$(id).classList.toggle('on',v);
sb.from('app_config').select('*').limit(1).maybeSingle().then(r=>{const c=r.data||{};dj=c.dj_mixes_enabled!==false;pr=!!c.premium_enabled;tgl('#tdj',dj);tgl('#tpr',pr);$('#hi').value=c.hero_image_url||'';$('#ib').value=c.invite_base||'';$('#su').value=c.share_url||'';$('#au').value=c.api_url||''});
$('#tdj').onclick=()=>{dj=!dj;tgl('#tdj',dj)};$('#tpr').onclick=()=>{pr=!pr;tgl('#tpr',pr)};
const https=v=>!v||/^https:\/\/[^\s'"<>]+$/.test(v);
$('#sa').onclick=()=>{const h=$('#hi').value.trim();if(!https(h)){toast('Links must start with https://');return}rpc('admin_set_config',{p_hero:h,p_premium:pr,p_dj:dj}).then(()=>toast('Saved')).catch(e=>toast(e.message))};
$('#sl').onclick=()=>{const a=$('#ib').value.trim(),b=$('#su').value.trim();if(!https(a)||!https(b)){toast('Links must start with https://');return}rpc('admin_set_links',{p_invite:a,p_share:b}).then(()=>toast('Links saved')).catch(e=>toast(e.message))};
$('#sv2').onclick=()=>{const a=$('#au').value.trim().replace(/\/+$/,'');if(!https(a)){toast('Must start with https://');return}rpc('admin_set_api',{p_url:a}).then(()=>toast(a?'App now uses that server':'App now uses the main server')).catch(e=>toast(e.message))};
$('#bgu').onclick=()=>{const f=$('#bgf').files[0],n=$('#bgn').value.trim();if(!f||!n){toast('Add a name and a picture');return}$('#bgu').disabled=true;shrink(f,1080,.82).then(b=>{const p='bg/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';return sb.storage.from('backgrounds').upload(p,b,{contentType:'image/jpeg',cacheControl:'31536000'}).then(r=>{if(r.error)throw r.error;return sb.from('backgrounds').insert({name:n,path:p})}).then(r=>{if(r.error)throw r.error;toast('Uploaded');$('#bgn').value='';$('#bgf').value='';bgList()})}).catch(e=>toast(e.message||'Upload failed')).then(()=>$('#bgu').disabled=false)};bgList();
const ld=()=>sb.from('legal_docs').select('content').eq('kind',$('#lk').value).maybeSingle().then(r=>$('#lt').value=(r.data&&r.data.content)||'');$('#lk').onchange=ld;ld();
$('#sg2').onclick=()=>rpc('admin_set_legal',{p_kind:$('#lk').value,p_content:$('#lt').value}).then(()=>toast('Published')).catch(e=>toast(e.message))}

const shrink=(f,w,q)=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const r=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',q)};im.onerror=rej;im.src=u});
function bgList(){sb.from('backgrounds').select('*').order('sort').order('created_at',{ascending:false}).then(r=>{const d=r.data||[];$('#bgl').innerHTML=d.length?d.map(x=>`<div class="c" style="padding:10px"><div style="aspect-ratio:3/4;border-radius:10px;background:var(--s2) url('${C.SUPA_URL}/storage/v1/object/public/backgrounds/${esc(x.path)}') center/cover;${x.active?'':'opacity:.4'}"></div><div class="row" style="border:0;padding:8px 0 0"><span class="sm">${esc(x.name)}</span><span><button class="tg ${x.active?'on':''}" data-a="${x.id}" data-v="${x.active?1:0}" title="Show or hide"></button> <button class="d" data-d="${x.id}" data-p="${esc(x.path)}" style="padding:4px 8px">X</button></span></div></div>`).join(''):'<p class="mut sm">No backgrounds yet. Upload the first one.</p>';
document.querySelectorAll('#bgl [data-a]').forEach(b=>b.onclick=()=>sb.from('backgrounds').update({active:b.dataset.v!=='1'}).eq('id',b.dataset.a).then(bgList));
document.querySelectorAll('#bgl [data-d]').forEach(b=>b.onclick=()=>ask('Delete this background?','Delete',()=>{sb.storage.from('backgrounds').remove([b.dataset.p]).then(()=>sb.from('backgrounds').delete().eq('id',b.dataset.d)).then(()=>{toast('Deleted');bgList()})},1))})}
/* AUTH */
function enter(){$('#lg').classList.add('hide');$('#app').classList.remove('hide');nav();show('ov')}
function gate(){return rpc('is_admin').then(ok=>{if(ok)enter();else{$('#lm').textContent='This account is not an admin.';sb.auth.signOut()}}).catch(()=>{$('#lm').textContent='Could not check admin access.'})}
$('#lb').onclick=()=>{$('#lm').textContent='';sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value}).then(r=>{if(r.error){$('#lm').textContent=r.error.message;return}gate()})};
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lb').click()});
$('#lo').onclick=()=>sb.auth.signOut().then(()=>location.reload());
if(sb)sb.auth.getSession().then(r=>{if(r.data.session)gate()});
</script></body></html>
