[build]
  command = "rm -rf public && mkdir public && cp -r index.html sw.js manifest.json config.js privacy.html terms.html download.html admin.html _headers icons images .well-known public/ && (cp SonaPlay.apk public/ 2>/dev/null || true)"
  publish = "public"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
